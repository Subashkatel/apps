name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check-publication.py --self-test
      - run: python3 tools/check-publication.py --staged
      - run: python3 tools/test-setup.py
      - name: Check shell syntax
        run: for script in build.sh install.sh sync.sh */build.sh; do bash -n "$script" || exit; done
      - name: Check Python syntax
        run: python3 -m compileall -q tools
